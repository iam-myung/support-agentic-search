<!doctype html>
<html lang="zh">
  <head><meta charset="UTF-8" /><title>04-local</title></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; overflow:hidden; font-family:system-ui,"Segoe UI",sans-serif; color:#0f172a; }
        .bg { position:absolute; inset:0; background:#070b10; }
        .world { position:absolute; inset:0; will-change:transform; }
        .head { position:absolute; left:100px; top:60px; color:#f8fafc; }
        .kicker { font-family:ui-monospace,Consolas,monospace; color:#5eead4; letter-spacing:.16em; font-size:16px; font-weight:700; }
        .title { font-size:44px; font-weight:800; margin:8px 0 0; color:#f8fafc; }
        .note { margin:10px 0 0; font-size:18px; color:rgba(248,250,252,.5); }
        .hub { position:absolute; left:160px; top:320px; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#2dd4bf,#0f766e 55%,#083d39); color:#fff; display:grid; place-items:center; text-align:center; box-shadow:0 0 60px rgba(45,212,191,.45); }
        .hub strong { display:block; font-size:30px; }
        .hub span { font-family:ui-monospace,Consolas,monospace; font-size:14px; opacity:.85; }
        .ring { position:absolute; left:130px; top:290px; width:360px; height:360px; border-radius:50%; border:2px dashed rgba(45,212,191,.35); }
        .chip { position:absolute; width:430px; padding:20px 22px; border-radius:16px; background:#f8fafc; border:1px solid rgba(45,212,191,.25); box-shadow:0 16px 40px rgba(0,0,0,.35); }
        .chip b { display:block; font-size:20px; margin-bottom:6px; color:#0f172a; }
        .chip p { margin:0; font-size:17px; color:rgba(15,23,42,.65); line-height:1.4; }
        #ch1 { left:620px; top:240px; } #ch2 { left:1100px; top:360px; } #ch3 { left:680px; top:580px; }
        svg.lines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
        .wire { fill:none; stroke:#2dd4bf; stroke-width:2.5; stroke-linecap:round; opacity:.85; filter:drop-shadow(0 0 6px #2dd4bf); }
      </style>
      <div id="root" data-composition-id="04-local" data-width="1920" data-height="1080" data-duration="10.5">
        <div id="l-bg" class="clip bg" data-start="0" data-duration="10.5" data-track-index="0"></div>
        <div id="l-layer" class="clip" data-start="0" data-duration="10.5" data-track-index="1" style="inset:0;position:absolute">
          <div id="l-world" class="world">
            <div class="head">
              <div id="l-k" class="kicker">DATA FLOW · local_retrieve</div>
              <h2 id="l-t" class="title">数据流①：本地知识库召回</h2>
              <p id="l-n" class="note">向量 + 关键词双路 · 证据进入本回合上下文</p>
            </div>
            <svg class="lines" viewBox="0 0 1920 1080">
              <path id="w1" class="wire" d="M460 470 C560 470, 580 320, 620 300" />
              <path id="w2" class="wire" d="M460 480 C700 480, 900 440, 1100 420" />
              <path id="w3" class="wire" d="M460 520 C600 540, 640 640, 680 660" />
            </svg>
            <div id="l-ring" class="ring"></div>
            <div id="l-hub" class="hub"><div><strong>本地库</strong><span>PG · 向量 · 关键词</span></div></div>
            <div id="ch1" class="chip"><b>FAQ 片段</b><p>密码重置用户应等待确认邮件。</p></div>
            <div id="ch2" class="chip"><b>政策 A</b><p>密码重置完成前必须通过邮箱 MFA。</p></div>
            <div id="ch3" class="chip"><b>错误码参考</b><p>E1001 表示缓存未预热（相关排障语料）。</p></div>
          </div>
        </div>
      </div>
      <script>
        const root = document.querySelector('[data-composition-id="04-local"]');
        const tl = gsap.timeline({ paused: true });
        ["#w1","#w2","#w3"].forEach((sel) => {
          const el = root.querySelector(sel);
          if (!el) return;
          const len = el.getTotalLength();
          el.style.strokeDasharray = String(len);
          el.style.strokeDashoffset = String(len);
        });
        tl.fromTo(root.querySelector("#l-k"), { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power4.out" }, 0.08);
        tl.fromTo(root.querySelector("#l-t"), { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 0.18);
        tl.fromTo(root.querySelector("#l-n"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
        tl.fromTo(root.querySelector("#l-hub"), { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.5);
        tl.fromTo(root.querySelector("#l-ring"), { scale: 0.6, opacity: 0, rotate: 0 }, { scale: 1, opacity: 1, rotate: 180, duration: 1.2, ease: "power2.out" }, 0.6);
        tl.to(root.querySelector("#l-hub"), { boxShadow: "0 0 100px rgba(45,212,191,0.8)", duration: 0.4, yoyo: true, repeat: 3 }, 1.2);
        ["#w1","#w2","#w3"].forEach((sel, i) => {
          tl.to(root.querySelector(sel), { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 1.6 + i * 0.12);
        });
        [["#ch1", -80, -40], ["#ch2", 80, -20], ["#ch3", -40, 60]].forEach(([sel, dx, dy], i) => {
          tl.fromTo(root.querySelector(sel), { x: dx, y: dy, scale: 0.6, opacity: 0, rotate: -8 }, { x: 0, y: 0, scale: 1, opacity: 1, rotate: 0, duration: 0.55, ease: "power4.out" }, 2.1 + i * 0.18);
        });
        tl.to(root.querySelector("#l-world"), { x: -200, duration: 0.4, ease: "power4.in" }, 9.5);
        window.__timelines["04-local"] = tl;
      </script>
    </template>
  </body>
</html>
