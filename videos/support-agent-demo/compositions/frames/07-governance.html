<!doctype html>
<html lang="zh">
  <head><meta charset="UTF-8" /><title>07-governance</title></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; overflow:hidden; color:#f8fafc; font-family:system-ui,"Segoe UI",sans-serif; }
        .bg { position:absolute; inset:0; background:#070b10; }
        .world { position:absolute; inset:0; will-change:transform; }
        .head { position:absolute; left:100px; top:56px; }
        .kicker { font-family:ui-monospace,Consolas,monospace; color:#5eead4; letter-spacing:.16em; font-size:16px; }
        .title { font-size:44px; font-weight:800; margin:8px 0 0; }
        .grid { position:absolute; left:90px; right:90px; top:200px; display:grid; grid-template-columns:1fr 1fr; gap:22px; }
        .card { border-radius:20px; padding:28px 30px; border:1px solid rgba(45,212,191,.28); background:linear-gradient(160deg,rgba(20,36,34,.95),rgba(10,14,18,.98)); min-height:280px; box-shadow:0 16px 40px rgba(0,0,0,.35); }
        .card .tag { display:inline-block; font-family:ui-monospace,Consolas,monospace; font-size:13px; letter-spacing:.12em; color:#2dd4bf; margin-bottom:14px; padding:6px 10px; border-radius:8px; background:rgba(15,118,110,.25); }
        .card h3 { margin:0 0 12px; font-size:28px; font-weight:800; }
        .card p { margin:0; font-size:18px; line-height:1.55; color:rgba(248,250,252,.65); }
        .card ul { margin:12px 0 0; padding-left:1.2em; font-size:17px; line-height:1.55; color:rgba(248,250,252,.65); }
        .warn { border-color:rgba(45,212,191,.5); background:linear-gradient(160deg,rgba(15,118,110,.35),rgba(10,14,18,.98)); }
      </style>
      <div id="root" data-composition-id="07-governance" data-width="1920" data-height="1080" data-duration="10.5">
        <div id="g-bg" class="clip bg" data-start="0" data-duration="10.5" data-track-index="0"></div>
        <div id="g-layer" class="clip" data-start="0" data-duration="10.5" data-track-index="1" style="inset:0;position:absolute">
          <div id="g-world" class="world">
            <div class="head">
              <div id="g-k" class="kicker">GOVERNANCE · 边界</div>
              <h2 id="g-t" class="title">跑得通还不够：边界必须守住</h2>
            </div>
            <div class="grid">
              <div id="g1" class="card">
                <div class="tag">HARD CAPS</div>
                <h3>工具硬上限</h3>
                <ul>
                  <li>白名单仅 local_retrieve / web_search</li>
                  <li>工具调用 ≤ 8 · 网搜 ≤ 5</li>
                  <li>到顶即停，防止失控循环</li>
                </ul>
              </div>
              <div id="g2" class="card">
                <div class="tag">PUBLIC PROCESS</div>
                <h3>公开过程 ≠ 原始思维</h3>
                <p>客服可见可读步骤与来源判定；原始 CoT / Prompt / 密钥永不进入界面。</p>
              </div>
              <div id="g3" class="card warn">
                <div class="tag">DISCLOSURE</div>
                <h3>MIXED 必须披露</h3>
                <p>含网络结论时标注 knowledge_basis，并提示核对引用后再答复客户。</p>
              </div>
              <div id="g4" class="card">
                <div class="tag">HITL</div>
                <h3>可转人工</h3>
                <p>证据不足、冲突或需确认时进入 human_needed，不硬编答案。</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        const root = document.querySelector('[data-composition-id="07-governance"]');
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(root.querySelector("#g-k"), { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power4.out" }, 0.08);
        tl.fromTo(root.querySelector("#g-t"), { x: -40, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0.18);
        ["#g1","#g2","#g3","#g4"].forEach((sel, i) => {
          tl.fromTo(root.querySelector(sel), {
            y: 50, opacity: 0, scale: 0.94,
          }, {
            y: 0, opacity: 1, scale: 1,
            duration: 0.5, ease: "power4.out",
          }, 0.55 + i * 0.18);
        });
        tl.to(root.querySelector("#g3"), {
          boxShadow: "0 0 50px rgba(45,212,191,0.45)",
          duration: 0.45, yoyo: true, repeat: 3,
        }, 2.2);
        tl.to(root.querySelector("#g-world"), { x: -160, duration: 0.4, ease: "power4.in" }, 9.5);
        window.__timelines["07-governance"] = tl;
      </script>
    </template>
  </body>
</html>
