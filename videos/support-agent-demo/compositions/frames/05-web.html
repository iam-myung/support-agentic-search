<!doctype html>
<html lang="zh">
  <head><meta charset="UTF-8" /><title>05-web</title></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; overflow:hidden; font-family:system-ui,"Segoe UI",sans-serif; color:#f8fafc; }
        .bg { position:absolute; inset:0; background:#070b10; }
        .world { position:absolute; inset:0; will-change:transform; }
        .head { position:absolute; left:100px; top:60px; }
        .kicker { font-family:ui-monospace,Consolas,monospace; color:#7dd3fc; letter-spacing:.16em; font-size:16px; }
        .title { font-size:44px; font-weight:800; margin:8px 0 0; }
        .note { margin:10px 0 0; font-size:18px; color:rgba(248,250,252,.5); }
        .query { position:absolute; left:100px; top:180px; font-family:ui-monospace,Consolas,monospace; font-size:18px; color:#7dd3fc; background:rgba(14,30,50,.8); border:1px solid rgba(125,211,252,.35); padding:12px 16px; border-radius:10px; box-shadow:0 0 24px rgba(56,189,248,.2); }
        .core { position:absolute; left:220px; top:400px; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#7dd3fc,#0f766e); display:grid; place-items:center; font-weight:800; font-size:28px; box-shadow:0 0 50px rgba(56,189,248,.5); }
        .ring { position:absolute; left:140px; top:320px; width:320px; height:320px; border-radius:50%; border:2px dashed rgba(125,211,252,.4); }
        .ring2 { position:absolute; left:180px; top:360px; width:240px; height:240px; border-radius:50%; border:2px solid rgba(45,212,191,.3); }
        .sweep { position:absolute; left:220px; top:320px; width:160px; height:160px; transform-origin:80px 220px; background:conic-gradient(from 0deg,transparent 0deg,rgba(125,211,252,.45) 40deg,transparent 70deg); border-radius:50%; opacity:0; }
        .res { position:absolute; right:90px; width:860px; padding:20px 24px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid rgba(125,211,252,.28); box-shadow:0 12px 40px rgba(0,0,0,.35); }
        .res b { display:block; font-size:22px; margin-bottom:6px; }
        .res span { font-family:ui-monospace,Consolas,monospace; font-size:14px; color:#7dd3fc; }
        .res p { margin:8px 0 0; color:rgba(248,250,252,.62); font-size:17px; }
        #r1 { top:260px; } #r2 { top:450px; } #r3 { top:640px; }
      </style>
      <div id="root" data-composition-id="05-web" data-width="1920" data-height="1080" data-duration="10.5">
        <div id="w-bg" class="clip bg" data-start="0" data-duration="10.5" data-track-index="0"></div>
        <div id="w-layer" class="clip" data-start="0" data-duration="10.5" data-track-index="1" style="inset:0;position:absolute">
          <div id="w-world" class="world">
            <div class="head">
              <div id="w-k" class="kicker">DATA FLOW · web_search</div>
              <h2 id="w-t" class="title">数据流②：开放网搜补证</h2>
              <p id="w-n" class="note">公开资料带 URL · 进入上下文供综合核对</p>
            </div>
            <div id="w-q" class="query">查询：password reset MFA best practices</div>
            <div id="w-ring" class="ring"></div>
            <div id="w-ring2" class="ring2"></div>
            <div id="w-sweep" class="sweep"></div>
            <div id="w-core" class="core">网搜</div>
            <div id="r1" class="res"><b>NIST 数字身份指南（摘要）</b><span>example.org/mfa-guide</span><p>建议对敏感账户启用第二因子，邮件链路可作恢复通道之一。</p></div>
            <div id="r2" class="res"><b>厂商安全博客：重置流程</b><span>docs.example.com/reset</span><p>重置前验证持有人身份，避免仅凭旧密码完成高风险变更。</p></div>
            <div id="r3" class="res"><b>社区 FAQ（摘录）</b><span>community.example.com/mfa</span><p>公开资料常见建议：启用 MFA，并保留备用验证方式。</p></div>
          </div>
        </div>
      </div>
      <script>
        const root = document.querySelector('[data-composition-id="05-web"]');
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(root.querySelector("#w-k"), { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power4.out" }, 0.08);
        tl.fromTo(root.querySelector("#w-t"), { y: 40, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0.18);
        tl.fromTo(root.querySelector("#w-n"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
        tl.fromTo(root.querySelector("#w-q"), { clipPath: "inset(0 100% 0 0)", opacity: 1 }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 0.55);
        tl.fromTo(root.querySelector("#w-core"), { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.8)" }, 0.85);
        tl.fromTo([root.querySelector("#w-ring"), root.querySelector("#w-ring2")], { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.95);
        tl.fromTo(root.querySelector("#w-sweep"), { opacity: 0, rotate: 0 }, { opacity: 0.9, duration: 0.2 }, 1.3);
        tl.to(root.querySelector("#w-sweep"), { rotate: 420, duration: 3.2, ease: "none" }, 1.35);
        tl.to(root.querySelector("#w-ring"), { rotate: 160, duration: 4, ease: "none" }, 1.3);
        tl.to(root.querySelector("#w-ring2"), { rotate: -120, duration: 4, ease: "none" }, 1.3);
        ["#r1","#r2","#r3"].forEach((sel, i) => {
          tl.fromTo(root.querySelector(sel), { x: 160, opacity: 0, skewX: 8, filter: "blur(10px)" }, { x: 0, opacity: 1, skewX: 0, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 2.1 + i * 0.2);
        });
        tl.to(root.querySelector("#w-world"), { x: -220, duration: 0.4, ease: "power4.in" }, 9.5);
        window.__timelines["05-web"] = tl;
      </script>
    </template>
  </body>
</html>
