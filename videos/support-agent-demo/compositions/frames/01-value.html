<!doctype html>
<html lang="zh">
  <head><meta charset="UTF-8" /><title>01-value</title></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; overflow:hidden; color:#f8fafc; font-family:system-ui,"Segoe UI",sans-serif; }
        .bg { position:absolute; inset:0; background:#070b10; }
        .orb { position:absolute; width:720px; height:720px; border-radius:50%; filter:blur(40px); background:radial-gradient(circle,rgba(15,118,110,.55),transparent 65%); left:-120px; top:-180px; }
        .orb2 { position:absolute; width:520px; height:520px; border-radius:50%; filter:blur(50px); background:radial-gradient(circle,rgba(56,189,248,.25),transparent 70%); right:-80px; bottom:-100px; }
        .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(94,234,212,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(94,234,212,.05) 1px,transparent 1px); background-size:64px 64px; mask-image:radial-gradient(ellipse at 35% 40%,#000 15%,transparent 70%); }
        .world { position:absolute; inset:0; will-change:transform; }
        .pad { position:absolute; left:110px; top:160px; max-width:1100px; }
        .kicker { font-family:ui-monospace,Consolas,monospace; font-size:16px; letter-spacing:.2em; color:#5eead4; font-weight:700; margin-bottom:20px; }
        .title { font-size:72px; font-weight:800; letter-spacing:-.04em; line-height:1.05; margin:0 0 22px; }
        .title em { font-style:normal; color:#2dd4bf; }
        .sub { font-size:26px; line-height:1.5; color:rgba(248,250,252,.68); margin:0 0 36px; max-width:28ch; }
        .pills { display:flex; gap:14px; flex-wrap:wrap; }
        .pill { padding:12px 18px; border-radius:12px; border:1px solid rgba(45,212,191,.35); background:rgba(15,118,110,.18); font-size:18px; font-weight:600; }
        .slash { position:absolute; left:0; top:0; width:8px; height:100%; background:linear-gradient(180deg,#2dd4bf,transparent); }
      </style>
      <div id="root" data-composition-id="01-value" data-width="1920" data-height="1080" data-duration="7.5">
        <div id="v-bg" class="clip bg" data-start="0" data-duration="7.5" data-track-index="0"></div>
        <div id="v-fx" class="clip" data-start="0" data-duration="7.5" data-track-index="1" style="inset:0;position:absolute">
          <div id="v-orb" class="orb"></div>
          <div id="v-orb2" class="orb2"></div>
          <div class="grid"></div>
        </div>
        <div id="v-layer" class="clip" data-start="0" data-duration="7.5" data-track-index="2" style="inset:0;position:absolute">
          <div class="slash"></div>
          <div id="v-world" class="world">
            <div class="pad">
              <div id="v-k" class="kicker">GITHUB · PROJECT EXPLAINER</div>
              <h1 id="v-t" class="title">企业级客服智能体<br/>不是聊天玩具，是<em>可核对检索</em></h1>
              <p id="v-s" class="sub">双源证据进建议，来源可披露，不够就转人工。</p>
              <div class="pills">
                <div id="p1" class="pill">本地知识库</div>
                <div id="p2" class="pill">开放网搜</div>
                <div id="p3" class="pill">来源判定 MIXED</div>
                <div id="p4" class="pill">HITL 转人工</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        const root = document.querySelector('[data-composition-id="01-value"]');
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(root.querySelector("#v-orb"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.0, ease: "power3.out" }, 0);
        tl.fromTo(root.querySelector("#v-orb2"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.1, ease: "power3.out" }, 0.1);
        tl.fromTo(root.querySelector("#v-k"), { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 0.25);
        tl.fromTo(root.querySelector("#v-t"), { y: 50, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.65, ease: "power4.out" }, 0.4);
        tl.fromTo(root.querySelector("#v-s"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.95);
        ["#p1","#p2","#p3","#p4"].forEach((sel, i) => {
          tl.fromTo(root.querySelector(sel), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.35 + i * 0.1);
        });
        tl.to(root.querySelector("#v-world"), { x: -160, duration: 0.4, ease: "power4.in" }, 6.5);
        window.__timelines["01-value"] = tl;
      </script>
    </template>
  </body>
</html>
